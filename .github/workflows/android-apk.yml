name: Android APK
on:
  push:
    branches:
      - apk/flowsave
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle yt-dlp from connected fork
        run: |
          git clone --depth=1 --branch master https://github.com/Jvust2/yt-dlp.git /tmp/yt-dlp-source
          cp -a /tmp/yt-dlp-source/yt_dlp android-app/app/src/main/python/yt_dlp
          echo "Bundled yt-dlp: $(cat /tmp/yt-dlp-source/yt_dlp/version.py | head -5)"
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unsigned-by-release / debug-signed APK
        run: gradle -p android-app --no-daemon assembleDebug --stacktrace
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowSave-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
