plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.jvust.flowsave'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jvust.flowsave'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    packaging {
        jniLibs.useLegacyPackaging = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version '3.13'
        pip {
            install 'certifi'
            install 'requests>=2.32.2,<3'
            install 'websockets>=13.0'
            install 'mutagen'
            // Paired with the bundled yt-dlp snapshot, required by YouTube JS challenge support.
            install 'yt-dlp-ejs==0.8.0'
        }
    }
}
