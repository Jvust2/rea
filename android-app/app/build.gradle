plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.jvust.flowsave'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jvust.flowsave'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
chaquopy {
    defaultConfig {
        version '3.13'
        pip {
            install 'certifi'
            install 'requests>=2.32.2,<3'
            install 'websockets>=13.0'
            install 'mutagen'
        }
    }
}
